[project]
name = "ha-bkkdetect"
version = "0.3.0"
description = "Native Home Assistant BKK vehicle detection and optional home arrival estimation"
requires-python = ">=3.14.2"
dependencies = ["pyproj==3.8.0", "shapely==2.2.0", "polyline==2.0.4"]

[dependency-groups]
dev = ["homeassistant==2026.10.0", "ruff>=0.17"]

[tool.ruff]
target-version = "py314"
line-length = 100
